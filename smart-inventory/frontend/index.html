<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bahi — Smart Inventory Decision Engine</title>
<style>
:root{
  --ink:#1c2230; --ink-soft:#4a5266; --paper:#faf7f0; --paper-raised:#ffffff;
  --line:#e4ddc9; --amber:#c8801a; --amber-deep:#a3620f; --green:#3f7a4e;
  --red:#b3452f; --red-bg:#fbeae4; --amber-bg:#fbf0dc; --green-bg:#eaf3ec;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
header{padding:28px 32px 20px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
h1{font-family:var(--serif);font-weight:normal;font-size:30px;margin:0;letter-spacing:.2px}
.tagline{color:var(--ink-soft);font-size:14px;margin-top:4px}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:#999}
.dot.ok{background:var(--green)}
.dot.bad{background:var(--red)}

main{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.upload-row{display:flex;gap:12px;align-items:center;margin-bottom:28px;flex-wrap:wrap}
.upload-row input[type=file]{font-size:14px}
button{font-family:var(--sans);font-size:14px;border:1.5px solid var(--ink);background:var(--paper-raised);
  color:var(--ink);padding:8px 16px;border-radius:3px;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper)}
button.primary{background:var(--ink);color:var(--paper)}
button.primary:hover{background:var(--amber-deep);border-color:var(--amber-deep)}
button:disabled{opacity:.4;cursor:default}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:32px}
.kpi{background:var(--paper-raised);padding:18px 20px}
.kpi .num{font-family:var(--serif);font-size:30px}
.kpi .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:2px}

h2{font-family:var(--serif);font-weight:normal;font-size:20px;border-bottom:1px solid var(--line);padding-bottom:8px;margin:36px 0 16px}

.insight{background:var(--paper-raised);border:1px solid var(--line);border-left:4px solid var(--ink-soft);
  padding:16px 18px;margin-bottom:12px}
.insight.high{border-left-color:var(--red)}
.insight.medium{border-left-color:var(--amber)}
.insight-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:2px;margin-right:6px}
.badge.high{background:var(--red-bg);color:var(--red)}
.badge.medium{background:var(--amber-bg);color:var(--amber-deep)}
.badge.type{background:#eee;color:var(--ink-soft)}
.headline{font-size:16px;margin:6px 0 4px}
.action{font-size:14px;color:var(--ink-soft)}
.right-col{text-align:right;min-width:150px}
.impact{font-family:var(--serif);font-size:20px;color:var(--amber-deep)}
.conf-bar{width:120px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 2px auto}
.conf-fill{height:100%;background:var(--green)}
.conf-label{font-size:11.5px;color:var(--ink-soft)}
.insight-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.insight-actions button{padding:5px 12px;font-size:13px}
.status-pill{font-size:12px;padding:3px 10px;border-radius:12px}
.status-pill.approved{background:var(--green-bg);color:var(--green)}
.status-pill.rejected{background:var(--red-bg);color:var(--red)}
.expand{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-size:13.5px;display:none}
.expand.open{display:block}
.trace-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.trace-table th,.trace-table td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.explain-box{background:var(--amber-bg);padding:10px 12px;border-radius:3px;margin-top:8px}
.explain-box .hi{color:var(--ink-soft);font-size:13px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.source-tag{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}

.sim-panel{background:var(--paper-raised);border:1px solid var(--line);padding:20px}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
label{font-size:13px;color:var(--ink-soft);display:block;margin-bottom:4px}
select,input[type=range]{width:100%}
.slider-val{font-size:13px;color:var(--ink);font-weight:600}
.sim-result{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.sim-col{padding:14px;border:1px solid var(--line)}
.sim-col h4{margin:0 0 8px;font-family:var(--serif);font-weight:normal;font-size:15px}
.sim-col.proj{background:var(--green-bg);border-color:var(--green)}
.sim-row{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0}

.chat-box{background:var(--paper-raised);border:1px solid var(--line);padding:16px}
.chat-log{min-height:60px;margin-bottom:12px}
.chat-msg{margin-bottom:10px;font-size:14px}
.chat-msg .who{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1;padding:9px 12px;border:1.5px solid var(--ink);border-radius:3px;font-size:14px;font-family:var(--sans)}

.empty{color:var(--ink-soft);font-size:14px;padding:20px;text-align:center;border:1px dashed var(--line)}
.small{font-size:12px;color:var(--ink-soft)}
.audit-item{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
</style>
</head>
<body>

<header>
  <div>
    <h1>Bahi — Smart Inventory Decision Engine</h1>
    <div class="tagline">Traceable AI insights for small retail, with a human always in the loop</div>
  </div>
  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Checking backend…</span>
  </div>
</header>

<main>
  <div class="upload-row">
    <input type="file" id="csvFile" accept=".csv">
    <button class="primary" onclick="uploadCsv()">Upload sales CSV</button>
    <span class="small" id="uploadMsg">Loads sample_sales.csv automatically if present on the backend.</span>
  </div>

  <div class="kpis" id="kpis"></div>

  <h2>Insights</h2>
  <div id="insightList"><div class="empty">Loading…</div></div>

  <h2>What-if simulator</h2>
  <div class="sim-panel">
    <div class="sim-grid">
      <div>
        <label for="simProduct">Product</label>
        <select id="simProduct"></select>
      </div>
      <div></div>
      <div>
        <label>Price change: <span class="slider-val" id="priceVal">0%</span></label>
        <input type="range" id="priceSlider" min="-30" max="30" value="0" oninput="priceVal.textContent=this.value+'%'">
      </div>
      <div>
        <label>Extra stock ordered: <span class="slider-val" id="stockVal">0 units</span></label>
        <input type="range" id="stockSlider" min="0" max="500" step="10" value="0" oninput="stockVal.textContent=this.value+' units'">
      </div>
    </div>
    <button class="primary" style="margin-top:16px" onclick="runSim()">Run simulation</button>
    <div class="sim-result" id="simResult" style="display:none"></div>
  </div>

  <h2>Ask your data</h2>
  <div class="chat-box">
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="e.g. Which items need urgent action this week?" onkeydown="if(event.key==='Enter')askQuestion()">
      <button class="primary" onclick="askQuestion()">Ask</button>
    </div>
  </div>

  <h2>Approval log</h2>
  <div id="auditList" class="empty">No decisions recorded yet.</div>
</main>

<script>
const API = "http://localhost:8000";
let INSIGHTS = [];

async function api(path, opts) {
  const res = await fetch(API + path, opts);
  if (!res.ok) { const t = await res.text(); throw new Error(t); }
  return res.json();
}

async function checkHealth() {
  try {
    const h = await api("/health");
    document.getElementById("statusDot").className = "dot ok";
    document.getElementById("statusText").textContent =
      h.data_loaded ? (h.ai_enabled ? "Backend connected · AI explanations on" : "Backend connected · AI key not set (using rule-based explanations)") : "Backend connected · no data yet";
  } catch (e) {
    document.getElementById("statusDot").className = "dot bad";
    document.getElementById("statusText").textContent = "Backend not reachable — is uvicorn running on :8000?";
  }
}

async function uploadCsv() {
  const f = document.getElementById("csvFile").files[0];
  if (!f) { alert("Choose a CSV file first."); return; }
  const fd = new FormData(); fd.append("file", f);
  document.getElementById("uploadMsg").textContent = "Uploading…";
  try {
    const r = await api("/upload", { method: "POST", body: fd });
    document.getElementById("uploadMsg").textContent = `Loaded ${r.rows} rows, ${r.insights} insights.`;
    loadInsights();
  } catch (e) { document.getElementById("uploadMsg").textContent = "Upload failed: " + e.message; }
}

function fmtInr(n) { return "₹" + Number(n).toLocaleString("en-IN"); }

async function loadInsights() {
  try {
    const r = await api("/insights");
    INSIGHTS = r.insights;
    renderKpis(r.kpis);
    renderInsights();
    renderSimOptions();
    checkHealth();
  } catch (e) {
    document.getElementById("insightList").innerHTML = `<div class="empty">Could not load insights. Is the backend running? (${e.message})</div>`;
  }
}

function renderKpis(k) {
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="num">${k.products}</div><div class="lbl">Products tracked</div></div>
    <div class="kpi"><div class="num">${fmtInr(k.revenue_30d)}</div><div class="lbl">Revenue, last 30 days</div></div>
    <div class="kpi"><div class="num">${k.insights}</div><div class="lbl">Active insights (${k.high_severity} urgent)</div></div>
    <div class="kpi"><div class="num">${fmtInr(k.at_risk_inr)}</div><div class="lbl">Value at risk / opportunity</div></div>`;
}

function renderInsights() {
  const el = document.getElementById("insightList");
  if (!INSIGHTS.length) { el.innerHTML = `<div class="empty">No issues detected in the current data.</div>`; return; }
  el.innerHTML = INSIGHTS.map(i => `
    <div class="insight ${i.severity}" id="card-${i.id}">
      <div class="insight-top">
        <div>
          <span class="badge ${i.severity}">${i.severity.toUpperCase()}</span>
          <span class="badge type">${i.type.replace('_',' ')}</span>
          <span class="badge type">${i.category}</span>
          <div class="headline">${i.headline}</div>
          <div class="action">→ ${i.recommended_action}</div>
        </div>
        <div class="right-col">
          <div class="impact">${fmtInr(i.impact_inr)}</div>
          <div class="conf-bar"><div class="conf-fill" style="width:${i.confidence*100}%"></div></div>
          <div class="conf-label">${Math.round(i.confidence*100)}% confidence</div>
        </div>
      </div>
      <div class="insight-actions">
        <button onclick="toggleTrace('${i.id}')">Show source rows</button>
        <button onclick="toggleExplain('${i.id}')">Explain in plain language</button>
        <span id="decision-${i.id}">
          <button onclick="decide('${i.id}','approved')">Approve</button>
          <button onclick="decide('${i.id}','rejected')">Reject</button>
        </span>
      </div>
      <div class="expand" id="trace-${i.id}"></div>
      <div class="expand" id="explain-${i.id}"></div>
    </div>`).join("");
}

async function toggleTrace(id) {
  const box = document.getElementById("trace-" + id);
  if (box.classList.contains("open")) { box.classList.remove("open"); return; }
  box.classList.add("open");
  box.innerHTML = "Loading source rows…";
  const r = await api("/trace/" + id);
  const rows = r.rows;
  const cols = ["date","product_name","units_sold","price","stock_on_hand"];
  box.innerHTML = `<span class="source-tag">Exact rows behind this insight</span>
    <table class="trace-table"><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>
    ${rows.map(row=>`<tr>${cols.map(c=>`<td>${row[c]}</td>`).join("")}</tr>`).join("")}</table>`;
}

async function toggleExplain(id) {
  const box = document.getElementById("explain-" + id);
  if (box.classList.contains("open")) { box.classList.remove("open"); return; }
  box.classList.add("open");
  box.innerHTML = "Asking Claude…";
  const r = await api("/explain/" + id);
  box.innerHTML = `<div class="explain-box">
      <span class="source-tag">${r.source === 'llm' ? 'AI explanation' : 'Rule-based summary (no API key set)'}</span>
      <div>${r.text}</div>
      ${r.hindi ? `<div class="hi">${r.hindi}</div>` : ""}
    </div>`;
}

async function decide(id, decision) {
  await api("/approve", { method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ insight_id: id, decision }) });
  document.getElementById("decision-" + id).innerHTML =
    `<span class="status-pill ${decision}">${decision === 'approved' ? '✓ Approved' : '✕ Rejected'}</span>`;
  loadAudit();
}

async function loadAudit() {
  const a = await api("/audit");
  const keys = Object.keys(a);
  const el = document.getElementById("auditList");
  if (!keys.length) { el.className = "empty"; el.textContent = "No decisions recorded yet."; return; }
  el.className = "";
  el.innerHTML = keys.map(k => `<div class="audit-item"><span>${k}</span>
    <span class="status-pill ${a[k].status}">${a[k].status} · ${a[k].at}</span></div>`).join("");
}

function renderSimOptions() {
  const seen = new Set();
  const opts = [];
  INSIGHTS.forEach(i => { if (!seen.has(i.product_id)) { seen.add(i.product_id); opts.push(i); } });
  const sel = document.getElementById("simProduct");
  sel.innerHTML = opts.map(i => `<option value="${i.product_id}">${i.product}</option>`).join("")
    || `<option value="">No products yet</option>`;
}

async function runSim() {
  const product_id = document.getElementById("simProduct").value;
  if (!product_id) return;
  const price_change_pct = Number(document.getElementById("priceSlider").value);
  const extra_stock = Number(document.getElementById("stockSlider").value);
  const r = await api("/simulate", { method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ product_id, price_change_pct, extra_stock }) });
  const box = document.getElementById("simResult");
  box.style.display = "grid";
  const col = (title, d, cls) => `<div class="sim-col ${cls||''}"><h4>${title}</h4>
    <div class="sim-row"><span>Daily demand</span><span>${d.daily_demand} units</span></div>
    <div class="sim-row"><span>Price</span><span>${fmtInr(d.price)}</span></div>
    <div class="sim-row"><span>Units sold (${r.horizon_days}d)</span><span>${d.units_sold}</span></div>
    <div class="sim-row"><span>Revenue</span><span>${fmtInr(d.revenue)}</span></div>
    <div class="sim-row"><span>Stock-out day</span><span>${d.stockout_day ?? 'None in window'}</span></div></div>`;
  box.innerHTML = col("Current path", r.current) + col("If you act", r.projected, "proj");
}

async function askQuestion() {
  const input = document.getElementById("chatInput");
  const q = input.value.trim();
  if (!q) return;
  const log = document.getElementById("chatLog");
  log.innerHTML += `<div class="chat-msg"><div class="who">You</div>${q}</div>`;
  input.value = "";
  log.innerHTML += `<div class="chat-msg" id="thinking"><div class="who">Assistant</div>Thinking…</div>`;
  log.scrollTop = log.scrollHeight;
  try {
    const r = await api("/ask", { method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ question: q }) });
    document.getElementById("thinking").outerHTML =
      `<div class="chat-msg"><div class="who">${r.source === 'llm' ? 'Assistant' : 'Assistant (offline mode)'}</div>${r.text}</div>`;
  } catch (e) {
    document.getElementById("thinking").outerHTML = `<div class="chat-msg"><div class="who">Assistant</div>Something went wrong: ${e.message}</div>`;
  }
  log.scrollTop = log.scrollHeight;
}

checkHealth();
loadInsights();
loadAudit();
</script>
</body>
</html>
